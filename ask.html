<script>
const API_URL='https://helloworld.d84124091.workers.dev/';
const btn=document.getElementById('ping'),out=document.getElementById('pingOut');
btn.addEventListener('click',async()=>{
  btn.disabled=true;out.textContent='連線中…';
  try{
    const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'test'})});
    const text=await res.text();
    out.textContent=res.ok?text:'失敗（HTTP '+res.status+'）：'+text;
  }catch(e){
    out.textContent='連線失敗：'+e.message+'。請確認網址正確、Worker 已部署，且網路正常。';
  }finally{btn.disabled=false}
});
