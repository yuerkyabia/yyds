<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>問答｜婚姻狀態與憂鬱、焦慮、壓力的關係</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site"><div class="in">
<a class="brand" href="index.html">婚姻狀態與憂鬱、焦慮、壓力</a>
<nav aria-label="主要導覽"><a href="index.html">首頁</a><a href="results.html">研究結果</a><a href="ask.html" aria-current="page">問答</a><a href="about.html">關於研究</a></nav>
</div></header>
<main>
<h1>問答</h1>
<section>
<label for="q" style="display:block;margin-bottom:6px;font-weight:500">輸入問題</label>
<div style="display:flex;gap:8px;flex-wrap:wrap">
<input id="q" type="text" maxlength="2000" placeholder="例如：哪一組的憂鬱平均最高？" style="flex:1;min-width:200px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font:inherit;color:var(--ink)">
<button class="apply" id="send" type="button">送出</button>
</div>
<div id="ans" aria-live="polite" style="margin-top:14px;white-space:pre-wrap;line-height:1.7"></div>
</section>
<section>
<h2>測試連線</h2>
<button class="apply" id="ping" type="button">測試連線</button>
<pre id="pingOut" aria-live="polite" style="margin:12px 0 0;white-space:pre-wrap;word-break:break-all;font-size:14px;color:var(--mute)"></pre>
</section>
<section>
<h2>測試 Gemini</h2>
<button class="apply" id="gem" type="button">測試 Gemini</button>
<pre id="gemOut" aria-live="polite" style="margin:12px 0 0;white-space:pre-wrap;word-break:break-all;font-size:14px;color:var(--mute)"></pre>
</section>
</main>
<footer class="foot"><div class="in"><span>組別：（請填寫）</span><span>組員：（請填寫）</span></div></footer>

<script>
const API_URL='https://helloworld.d84124091.workers.dev/';
const btn=document.getElementById('ping'),out=document.getElementById('pingOut');
btn.addEventListener('click',async()=>{
  btn.disabled=true;out.textContent='連線中…';
  try{
    const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'test'})});
    const text=await res.text();
    out.textContent=res.ok?text:'失敗（HTTP '+res.status+'）：'+text;
  }catch(e){
    out.textContent='連線失敗：'+e.message+'。請確認網址正確、Worker 已部署，且網路正常。';
  }finally{btn.disabled=false}
});
const gem=document.getElementById('gem'),gemOut=document.getElementById('gemOut');
gem.addEventListener('click',async()=>{
  gem.disabled=true;gemOut.textContent='Gemini 回覆中…';
  try{
    const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'ask',question:'請用一句話自我介紹'})});
    const text=await res.text();
    let data=null;try{data=JSON.parse(text)}catch(e){}
    if(res.ok&&data&&typeof data.answer==='string')gemOut.textContent=data.answer;
    else gemOut.textContent='失敗（HTTP '+res.status+'）：'+((data&&data.error)||text);
  }catch(e){
    gemOut.textContent='連線失敗：'+e.message+'。請確認網址正確、Worker 已部署，且網路正常。';
  }finally{gem.disabled=false}
});
const q=document.getElementById('q'),send=document.getElementById('send'),ans=document.getElementById('ans');
async function submitQ(){
  const question=q.value.trim();
  if(!question){ans.textContent='請先輸入問題。';return}
  send.disabled=true;ans.style.color='var(--mute)';ans.textContent='回答中…';
  try{
    const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'ask',question})});
    const text=await res.text();
    let data=null;try{data=JSON.parse(text)}catch(e){}
    if(res.ok&&data&&typeof data.answer==='string'){ans.style.color='var(--ink)';ans.textContent=data.answer}
    else ans.textContent='失敗（HTTP '+res.status+'）：'+((data&&data.error)||text);
  }catch(e){
    ans.textContent='連線失敗：'+e.message+'。請確認網址正確、Worker 已部署，且網路正常。';
  }finally{send.disabled=false}
}
send.addEventListener('click',submitQ);
q.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing)submitQ()});
</script>
</body>
</html>
